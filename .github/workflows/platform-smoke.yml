name: platform-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install CodeGraph
        run: npm install -g @colbymchenry/codegraph@0.9.9

      - name: Install Claude Code validator
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Initialize CodeGraph index
        run: codegraph init

      - name: Configure released controller fixture
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import os from 'node:os'; import path from 'node:path'; const controller = path.join(os.tmpdir(), 'enterprise-harness-controller'); fs.mkdirSync(controller, { recursive: true }); fs.appendFileSync(process.env.GITHUB_ENV, 'ENTERPRISE_HARNESS_CONTROLLER_ROOT=' + controller + os.EOL);"

      - name: Bootstrap runtime
        run: node runtime/cli.mjs bootstrap

      - name: P0 acceptance
        run: npm run prepublish-check

      - name: Setup local adapter
        run: node runtime/cli.mjs setup-local-adapter --write

      - name: Doctor
        run: node runtime/cli.mjs doctor

      - name: Sync
        run: node runtime/cli.mjs sync

      - name: Verify release surface
        run: node runtime/cli.mjs verify --release-surface

      - name: Upstream check
        run: node runtime/cli.mjs upstream-check

      - name: Build artifact manifest
        run: node bin/package.mjs --out dist

      - name: Upload deterministic reports
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist/manifest-files.json
            dist/SHA256SUMS
          if-no-files-found: error

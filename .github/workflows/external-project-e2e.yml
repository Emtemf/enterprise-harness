name: External Project E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  maven-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: node test/external-project/maven-lifecycle-e2e.mjs

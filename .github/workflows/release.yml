name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install CodeGraph
        run: npm install -g @colbymchenry/codegraph@0.9.9

      - name: Install Claude Code validator
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Initialize CodeGraph index
        run: codegraph init

      - name: Verify tag and package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('tag/package version mismatch')"

      - name: P0 acceptance
        run: npm run prepublish-check

      - name: Verify release surface
        run: node runtime/cli.mjs verify --release-surface

      - name: Build tarball
        run: node bin/package.mjs --out dist

      - name: Generate SBOM
        run: node bin/sbom.mjs dist/sbom.cdx.json

      - name: Generate release notes from CHANGELOG
        run: node bin/release-notes.mjs "${GITHUB_REF_NAME#v}" dist/release-notes.md

      - name: Validate unpacked artifact
        run: node bin/validate-artifact.mjs "dist/enterprise-harness-${GITHUB_REF_NAME#v}.tar.gz" "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/*.tar.gz
            dist/manifest-files.json
            dist/SHA256SUMS
            dist/sbom.cdx.json
          make_latest: true
